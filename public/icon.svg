<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="#000000" />
  
  <!-- CPU Chip body (rounded rectangle) -->
  <rect x="136" y="136" width="240" height="240" rx="28" fill="none" stroke="#39ff14" stroke-width="16" />
  
  <!-- CPU inner chip (smaller rectangle) -->
  <rect x="192" y="192" width="128" height="128" rx="12" fill="#39ff14" opacity="0.15" />
  <rect x="192" y="192" width="128" height="128" rx="12" fill="none" stroke="#39ff14" stroke-width="8" />
  
  <!-- CPU Pins - Top -->
  <line x1="208" y1="96" x2="208" y2="136" stroke="#39ff14" stroke-width="12" stroke-linecap="round" />
  <line x1="256" y1="96" x2="256" y2="136" stroke="#39ff14" stroke-width="12" stroke-linecap="round" />
  <line x1="304" y1="96" x2="304" y2="136" stroke="#39ff14" stroke-width="12" stroke-linecap="round" />
  
  <!-- CPU Pins - Bottom -->
  <line x1="208" y1="376" x2="208" y2="416" stroke="#39ff14" stroke-width="12" stroke-linecap="round" />
  <line x1="256" y1="376" x2="256" y2="416" stroke="#39ff14" stroke-width="12" stroke-linecap="round" />
  <line x1="304" y1="376" x2="304" y2="416" stroke="#39ff14" stroke-width="12" stroke-linecap="round" />
  
  <!-- CPU Pins - Left -->
  <line x1="96" y1="208" x2="136" y2="208" stroke="#39ff14" stroke-width="12" stroke-linecap="round" />
  <line x1="96" y1="256" x2="136" y2="256" stroke="#39ff14" stroke-width="12" stroke-linecap="round" />
  <line x1="96" y1="304" x2="136" y2="304" stroke="#39ff14" stroke-width="12" stroke-linecap="round" />
  
  <!-- CPU Pins - Right -->
  <line x1="376" y1="208" x2="416" y2="208" stroke="#39ff14" stroke-width="12" stroke-linecap="round" />
  <line x1="376" y1="256" x2="416" y2="256" stroke="#39ff14" stroke-width="12" stroke-linecap="round" />
  <line x1="376" y1="304" x2="416" y2="304" stroke="#39ff14" stroke-width="12" stroke-linecap="round" />
</svg>
